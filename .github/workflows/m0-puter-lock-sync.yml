name: M0 Puter lock sync

on:
  push:
    branches:
      - m0/remote-puter-provider
    paths:
      - 'package.json'
      - '.github/workflows/m0-puter-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: m0/remote-puter-provider

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Update package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "m0: lock Puter.js dependency"
          git pull --rebase origin m0/remote-puter-provider
          git push origin HEAD:m0/remote-puter-provider
