name: M3 import order fix

on:
  push:
    branches:
      - m3/information-propagation
    paths:
      - .github/workflows/m3-import-order-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m3/information-propagation
      - run: python3 tools/fix_m3_import_order.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "fix: satisfy M3 import order"
          git push origin HEAD:m3/information-propagation
