name: M0 legal registry sync

on:
  push:
    branches:
      - m0/one-living-npc
    paths:
      - '.github/workflows/m0-legal-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: m0/one-living-npc

      - name: Register M0 inference dependencies
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('legal/third-party.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entries = {entry['id']: entry for entry in data['entries']}

          entries['webllm-0.2.82'] = {
              'id': 'webllm-0.2.82',
              'type': 'software',
              'name': '@mlc-ai/web-llm',
              'creator': 'MLC community and contributors',
              'version': '0.2.82',
              'sourceUrl': 'https://github.com/mlc-ai/web-llm/tree/v0.2.82',
              'licenseName': 'Apache License 2.0',
              'licenseUrl': 'https://github.com/mlc-ai/web-llm/blob/v0.2.82/LICENSE',
              'reviewStatus': 'approved',
              'releaseAllowed': True,
              'attributionRequired': False,
              'requiredCreditText': '',
              'commercialUse': 'allowed',
              'modification': 'allowed',
              'redistribution': 'allowed',
              'aiProcessing': 'not_applicable',
              'usedIn': [
                  'package.json',
                  'src/ai/webllm-inference-provider.ts',
                  'src/ai/webllm-worker.ts'
              ],
              'notes': 'Browser-local inference runtime pinned exactly for M0. Apache-2.0 was verified at the v0.2.82 source tag. Runtime is bundled with the browser application; preserve applicable Apache license/notice obligations.',
              'evidence': [
                  'legal/licenses/webllm-0.2.82-Apache-2.0.txt',
                  'https://github.com/mlc-ai/web-llm/blob/v0.2.82/LICENSE',
                  'https://www.npmjs.com/package/@mlc-ai/web-llm/v/0.2.82'
              ],
              'lastReviewed': '2026-09-01'
          }

          entries['qwen3-0.6b-q4f16-1-mlc'] = {
              'id': 'qwen3-0.6b-q4f16-1-mlc',
              'type': 'ai_model',
              'name': 'Qwen3-0.6B q4f16_1 (MLC)',
              'creator': 'Qwen Team / MLC community',
              'version': 'Qwen3-0.6B q4f16_1 MLC',
              'sourceUrl': 'https://huggingface.co/mlc-ai/Qwen3-0.6B-q4f16_1-MLC',
              'licenseName': 'Quantized artifact license pending explicit verification; base Qwen3-0.6B is Apache License 2.0',
              'licenseUrl': 'https://huggingface.co/Qwen/Qwen3-0.6B/blob/main/LICENSE',
              'reviewStatus': 'pending',
              'releaseAllowed': False,
              'attributionRequired': False,
              'requiredCreditText': '',
              'commercialUse': 'unclear',
              'modification': 'unclear',
              'redistribution': 'unclear',
              'aiProcessing': 'not_applicable',
              'usedIn': ['src/ai/webllm-inference-provider.ts'],
              'notes': 'M0 model candidate. The MLC model card identifies this as the q4f16_1 quantization of Qwen3-0.6B and explicitly targets MLC-LLM/WebLLM. The base Qwen3-0.6B repository is Apache-2.0, but the quantized artifact page does not currently expose an explicit license field in the evidence reviewed, so this entry remains pending rather than inheriting terms by assumption. The project does not commit or redistribute these weights in the Pages artifact; WebLLM downloads them from the upstream model repository into the user browser cache.',
              'evidence': [
                  'legal/licenses/qwen3-0.6b-base-Apache-2.0.txt',
                  'https://huggingface.co/mlc-ai/Qwen3-0.6B-q4f16_1-MLC',
                  'https://huggingface.co/Qwen/Qwen3-0.6B',
                  'https://huggingface.co/Qwen/Qwen3-0.6B/blob/main/LICENSE'
              ],
              'lastReviewed': '2026-09-01'
          }

          order = [entry['id'] for entry in data['entries']]
          for entry_id in ('webllm-0.2.82', 'qwen3-0.6b-q4f16-1-mlc'):
              if entry_id not in order:
                  order.append(entry_id)
          data['entries'] = [entries[entry_id] for entry_id in order]
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Preserve verified license evidence
        run: |
          curl -fsSL https://raw.githubusercontent.com/mlc-ai/web-llm/v0.2.82/LICENSE \
            -o legal/licenses/webllm-0.2.82-Apache-2.0.txt
          curl -fsSL https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/LICENSE \
            -o legal/licenses/qwen3-0.6b-base-Apache-2.0.txt

      - name: Validate and regenerate notices
        run: |
          python3 tools/legal/validate_third_party.py
          python3 tools/legal/generate_notices.py

      - name: Commit registry and generated views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal/
          if git diff --cached --quiet; then
            echo "Legal registry already synchronized"
            exit 0
          fi
          git commit -m "m0: register WebLLM and Qwen model provenance"
          git pull --rebase origin m0/one-living-npc
          git push origin HEAD:m0/one-living-npc
