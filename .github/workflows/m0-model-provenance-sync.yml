name: M0 model provenance sync

on:
  push:
    branches:
      - m0/gpu-compatible-model
    paths:
      - '.github/workflows/m0-model-provenance-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: m0/gpu-compatible-model

      - name: Update model provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('legal/third-party.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entries = {entry['id']: entry for entry in data['entries']}

          old = entries.get('qwen3-0.6b-q4f16-1-mlc')
          if old:
              old['reviewStatus'] = 'removed'
              old['releaseAllowed'] = False
              old['usedIn'] = []
              old['notes'] = (
                  'Former M0 experiment candidate. Human playtest showed unacceptable first-load friction '
                  'and then a GPUPipelineError compiling copy_single_page_kernel on the test GPU/driver path. '
                  'The q4f16_1 WebLLM entry requires shader-f16, so this candidate was retired from active use. '
                  'Original provenance evidence is preserved for audit history.'
              )
              old['lastReviewed'] = '2026-09-01'

          new_id = 'qwen2-5-0-5b-instruct-q4f32-1-mlc'
          entries[new_id] = {
              'id': new_id,
              'type': 'ai_model',
              'name': 'Qwen2.5-0.5B-Instruct q4f32_1 (MLC)',
              'creator': 'Qwen Team / MLC community',
              'version': 'Qwen2.5-0.5B-Instruct q4f32_1 MLC',
              'sourceUrl': 'https://huggingface.co/mlc-ai/Qwen2.5-0.5B-Instruct-q4f32_1-MLC',
              'licenseName': 'Quantized artifact license pending explicit verification; base Qwen2.5-0.5B-Instruct is Apache License 2.0',
              'licenseUrl': 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/blob/main/LICENSE',
              'reviewStatus': 'pending',
              'releaseAllowed': False,
              'attributionRequired': False,
              'requiredCreditText': '',
              'commercialUse': 'unclear',
              'modification': 'unclear',
              'redistribution': 'unclear',
              'aiProcessing': 'not_applicable',
              'usedIn': ['src/ai/webllm-inference-provider.ts'],
              'notes': (
                  'Active M0 compatibility candidate after the q4f16 Qwen3 experiment failed on the human test GPU. '
                  'WebLLM includes this q4f32_1 model in its prebuilt catalogue without a shader-f16 requirement; '
                  'the upstream MLC artifact is about 290 MB and WebLLM reports about 945 MB VRAM. '
                  'Base Qwen/Qwen2.5-0.5B-Instruct is Apache-2.0, but the exact MLC artifact page was not treated as '
                  'inheriting that license without explicit evidence. The project does not commit or redistribute model weights; '
                  'WebLLM downloads the upstream artifact into browser cache at runtime.'
              ),
              'evidence': [
                  'legal/licenses/qwen2.5-0.5b-instruct-base-Apache-2.0.txt',
                  'https://huggingface.co/mlc-ai/Qwen2.5-0.5B-Instruct-q4f32_1-MLC',
                  'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct',
                  'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/blob/main/LICENSE'
              ],
              'lastReviewed': '2026-09-01'
          }

          order = [entry['id'] for entry in data['entries']]
          if new_id not in order:
              order.append(new_id)
          data['entries'] = [entries[entry_id] for entry_id in order]
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Preserve base model license evidence
        run: |
          curl -fsSL https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main/LICENSE \
            -o legal/licenses/qwen2.5-0.5b-instruct-base-Apache-2.0.txt

      - name: Validate and regenerate notices
        run: |
          python3 tools/legal/validate_third_party.py
          python3 tools/legal/generate_notices.py

      - name: Commit provenance update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal/
          if git diff --cached --quiet; then
            echo "Registry already synchronized"
            exit 0
          fi
          git commit -m "m0: register q4f32 compatibility model"
          git pull --rebase origin m0/gpu-compatible-model
          git push origin HEAD:m0/gpu-compatible-model
