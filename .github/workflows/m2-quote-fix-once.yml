name: M2 quote fix

on:
  push:
    branches:
      - m2/memory-relationship
    paths:
      - .github/workflows/m2-quote-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m2/memory-relationship
      - run: python3 tools/fix_m2_quote.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "fix: repair M2 action string"
          git push origin HEAD:m2/memory-relationship
