name: M3 import fix

on:
  push:
    branches:
      - m3/information-propagation
    paths:
      - .github/workflows/m3-unused-import-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m3/information-propagation
      - run: python3 tools/remove_unused_m3_import.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "fix: remove unused M3 import"
          git push origin HEAD:m3/information-propagation
