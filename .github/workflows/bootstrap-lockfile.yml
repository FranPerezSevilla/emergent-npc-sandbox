name: Bootstrap lockfile generator

on:
  push:
    branches:
      - bootstrap/playcanvas-cloud-loop
    paths:
      - 'package.json'
      - '.github/workflows/bootstrap-lockfile.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: bootstrap/playcanvas-cloud-loop

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile when needed
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "bootstrap: lock npm dependencies"
          git pull --rebase origin bootstrap/playcanvas-cloud-loop
          git push origin HEAD:bootstrap/playcanvas-cloud-loop
