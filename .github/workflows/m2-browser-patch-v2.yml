name: M2 browser patch v2

on:
  push:
    branches:
      - m2/memory-relationship
    paths:
      - .github/workflows/m2-browser-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m2/memory-relationship
      - run: python3 tools/m2_patch_main.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "m2: make memory experiment browser-playable"
          git push origin HEAD:m2/memory-relationship
