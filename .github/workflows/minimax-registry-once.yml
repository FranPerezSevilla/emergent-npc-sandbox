name: One-shot MiniMax registry patch

on:
  push:
    branches:
      - m1/openrouter-free-model-fix
    paths:
      - .github/workflows/minimax-registry-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m1/openrouter-free-model-fix
      - name: Patch model registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('legal/third-party.json')
          data = json.loads(path.read_text())

          for entry in data['entries']:
              if entry.get('id') == 'openai-gpt-oss-20b-free-via-openrouter-m1':
                  entry['reviewStatus'] = 'removed'
                  entry['releaseAllowed'] = False
                  entry['usedIn'] = []
                  entry['notes'] = (
                      'Former M1 OpenRouter candidate. Human runtime test on 2026-09-02 returned HTTP 404 '
                      'stating that the free variant was unavailable and only the paid slug remained. Preserved as '
                      'experiment provenance; no longer used by the application.'
                  )
                  entry['lastReviewed'] = '2026-09-02'

          data['entries'] = [
              e for e in data['entries'] if e.get('id') != 'minimax-m3-free-via-openrouter-m1'
          ]
          data['entries'].append({
              'id': 'minimax-m3-free-via-openrouter-m1',
              'type': 'ai_model',
              'name': 'MiniMax M3 (free) via OpenRouter',
              'creator': 'MiniMax; hosted by providers routed through OpenRouter',
              'version': 'minimax/minimax-m3:free',
              'sourceUrl': 'https://openrouter.ai/minimax/minimax-m3:free',
              'licenseName': 'Model/provider/service terms — release review pending',
              'licenseUrl': 'https://openrouter.ai/minimax/minimax-m3:free',
              'reviewStatus': 'pending',
              'releaseAllowed': False,
              'attributionRequired': False,
              'requiredCreditText': '',
              'commercialUse': 'unclear',
              'modification': 'not_applicable',
              'redistribution': 'not_applicable',
              'aiProcessing': 'not_applicable',
              'usedIn': ['src/ai/openrouter-inference-provider.ts'],
              'notes': (
                  'Current explicit M1 prototype model selected after the prior gpt-oss free endpoint became '
                  'unavailable. OpenRouter listed the endpoint as free with text output and response_format JSON '
                  'support at review time. Free endpoint availability, rate limits, upstream provider privacy/data '
                  'terms and commercial/release suitability remain release-blocking until explicitly reviewed.'
              ),
              'evidence': [
                  'https://openrouter.ai/minimax/minimax-m3:free',
                  'https://openrouter.ai/docs/guides/privacy/data-collection',
                  'https://openrouter.ai/terms'
              ],
              'lastReviewed': '2026-09-02'
          })

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Regenerate notices
        run: python3 tools/legal/generate_notices.py
      - name: Validate registry
        run: python3 tools/legal/validate_third_party.py
      - name: Commit registry and notices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal/third-party.json legal/ATTRIBUTIONS.md legal/THIRD_PARTY_NOTICES.md
          git commit -m "legal: register MiniMax M3 M1 experiment"
          git push origin HEAD:m1/openrouter-free-model-fix
