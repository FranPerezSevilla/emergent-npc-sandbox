name: One-shot OpenRouter legal notices

on:
  push:
    branches:
      - m1/provider-auth-blocker-ui
    paths:
      - .github/workflows/openrouter-notices-once.yml

permissions:
  contents: write

jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m1/provider-auth-blocker-ui
      - name: Regenerate notices
        run: python3 tools/legal/generate_notices.py
      - name: Validate registry
        run: python3 tools/legal/validate_third_party.py
      - name: Commit notices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal/ATTRIBUTIONS.md legal/THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "legal: regenerate notices for OpenRouter"
          git push origin HEAD:m1/provider-auth-blocker-ui
